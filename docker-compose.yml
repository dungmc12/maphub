services:
  cityscout-db:
    image: postgres:16-alpine
    container_name: cityscout-db
    environment:
      POSTGRES_DB: cityscout
      POSTGRES_USER: cityscout
      POSTGRES_PASSWORD: MapHub@Dev2024
    ports:
      - "5432:5432"
    volumes:
      - cityscout-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityscout -d cityscout"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  cityscout-web:
    build:
      context: ./MapHub
      dockerfile: Dockerfile
    container_name: cityscout-web
    depends_on:
      cityscout-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DisableHttpsRedirection: "true"
      ConnectionStrings__DefaultConnection: "Host=cityscout-db;Port=5432;Database=cityscout;Username=cityscout;Password=MapHub@Dev2024;"
      GoogleMaps__ApiKey: "AIzaSyCJC-tQVXlidBVcFJ-HvZa9idgY-7pqT_8"
      AI__ApiKey: "AIzaSyCJC-tQVXlidBVcFJ-HvZa9idgY-7pqT_8"
      AI__Model: "gemini-2.0-flash"
      AI__EnableExternalProvider: "true"
      GoogleMaps__DefaultLatitude: "21.0285"
      GoogleMaps__DefaultLongitude: "105.8542"
      GoogleMaps__DefaultZoom: "13"
    ports:
      - "8080:8080"
    volumes:
      - cityscout-uploads:/app/wwwroot/uploads

volumes:
  cityscout-pg-data:
  cityscout-uploads:
