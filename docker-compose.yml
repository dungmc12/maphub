services:
  cityscout-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cityscout-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "MapHub@Dev2024"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - cityscout-mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P MapHub@Dev2024 -Q 'SELECT 1' -C -b -o /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  cityscout-web:
    build:
      context: ./MapHub
      dockerfile: Dockerfile
    container_name: cityscout-web
    depends_on:
      cityscout-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DisableHttpsRedirection: "true"
      ConnectionStrings__DefaultConnection: "Server=cityscout-db;Database=CityScout;User Id=sa;Password=MapHub@Dev2024;TrustServerCertificate=True;MultipleActiveResultSets=True;"
      GoogleMaps__ApiKey: "AIzaSyCJC-tQVXlidBVcFJ-HvZa9idgY-7pqT_8"
      AI__ApiKey: "AIzaSyCJC-tQVXlidBVcFJ-HvZa9idgY-7pqT_8"
      AI__Model: "gemini-2.0-flash"
      AI__EnableExternalProvider: "true"
      GoogleMaps__DefaultLatitude: "21.0285"
      GoogleMaps__DefaultLongitude: "105.8542"
      GoogleMaps__DefaultZoom: "13"
    ports:
      - "8080:8080"
    volumes:
      - cityscout-uploads:/app/wwwroot/uploads

volumes:
  cityscout-mssql-data:
  cityscout-uploads:
