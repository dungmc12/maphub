name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & verify Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MapHub/MapHub.csproj

      - name: Build (Release)
        run: dotnet build MapHub/MapHub.csproj -c Release --no-restore

      # App không có test project — khi nào thêm thì bật dòng dưới
      # - name: Test
      #   run: dotnet test -c Release

      - name: Verify Docker image builds
        run: docker build -t cityscout:ci ./MapHub
